<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Kültürpark Yönetim Paneli</title>
</head>
<body>
  <script src="https://unpkg.com/decap-cms@3.16.3/dist/decap-cms.js"></script>
  <!-- Ziyaretçi kareleri onay ekranına kısayol -->
  <a id="onayKisayol" href="/admin/onay/" style="position:fixed;right:20px;bottom:20px;z-index:9999;display:inline-flex;align-items:center;gap:8px;padding:12px 18px;border-radius:999px;background:#17803D;color:#fff;font:700 15px/1 system-ui,sans-serif;text-decoration:none;box-shadow:0 8px 24px rgba(0,0,0,.25)">📸 Onay bekleyenler <b id="onaySayi" style="display:none;min-width:22px;height:22px;padding:0 6px;border-radius:999px;background:#E8A33A;color:#1E1405;place-items:center;font-size:13px"></b></a>
  <script>
    fetch("/api/kareler", { cache: "no-store" }).then(function (r) { return r.json(); }).then(function (d) {
      var n = d && d.bekleyen; if (n > 0) { var b = document.getElementById("onaySayi"); b.textContent = n; b.style.display = "inline-grid"; }
    }).catch(function () {});
  </script>
</body>
</html>
