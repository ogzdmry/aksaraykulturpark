<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Onay Bekleyenler · Kültürpark</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,700;12..96,800&family=Figtree:wght@400;500;600;700&display=swap">
<style>
:root { --bg: #F4F7F4; --card: #fff; --fg: #18241D; --muted: #56645B; --line: #DDE4DE; --green: #17803D; --green-dk: #0F5E2C; --red: #B3261E; --lamp: #E8A33A; --display: "Bricolage Grotesque", system-ui, sans-serif; --body: "Figtree", "Segoe UI", system-ui, sans-serif; color-scheme: light }
* { box-sizing: border-box }
body { margin: 0; background: var(--bg); color: var(--fg); font: 400 16px/1.5 var(--body) }
h1, h2 { font-family: var(--display); margin: 0; letter-spacing: -.02em }
.wrap { width: min(1200px, 100% - 32px); margin-inline: auto }
header { background: var(--green-dk); color: #fff }
header .wrap { display: flex; align-items: center; gap: 16px; min-height: 68px; flex-wrap: wrap; padding-block: 10px }
header h1 { font-size: 1.35rem; flex: 1 }
header a, header button { color: #fff; font: 600 .92rem var(--body); text-decoration: none; background: rgba(255,255,255,.12); border: 0; padding: 9px 14px; border-radius: 999px; cursor: pointer }
.btn { font: 700 .95rem var(--body); border: 0; border-radius: 999px; padding: 11px 18px; cursor: pointer; display: inline-flex; align-items: center; justify-content: center; gap: 6px }
.btn[disabled] { opacity: .55; cursor: wait }
.g { background: var(--green); color: #fff } .g:hover { background: var(--green-dk) }
.r { background: #fff; color: var(--red); box-shadow: inset 0 0 0 1.5px var(--red) } .r:hover { background: #FCEEEE }
.o { background: #fff; color: var(--fg); box-shadow: inset 0 0 0 1.5px var(--line) } .o:hover { box-shadow: inset 0 0 0 1.5px var(--fg) }
.y { background: #FFF4DF; color: #7A4A00; box-shadow: inset 0 0 0 1.5px var(--lamp) } .y.on { background: var(--lamp); color: #1E1405 }
/* Giriş */
.giris { max-width: 400px; margin: 10vh auto; background: var(--card); border-radius: 20px; padding: 32px 28px; box-shadow: 0 12px 40px rgba(0,0,0,.08) }
.giris h2 { color: var(--green); font-size: 1.7rem } .giris p { color: var(--muted); margin: 8px 0 18px }
label { display: grid; gap: 6px; font-weight: 600; font-size: .92rem; margin-top: 12px }
input[type=password], input[type=text] { font: 500 1rem var(--body); padding: 12px 14px; border: 1.5px solid var(--line); border-radius: 12px; width: 100% }
input:focus { outline: none; border-color: var(--green); box-shadow: 0 0 0 3px rgba(23,128,61,.15) }
.giris .btn { width: 100%; margin-top: 18px }
.msg { min-height: 1.3em; color: var(--red); font-weight: 600; font-size: .9rem; margin: 12px 0 0 }
/* Liste */
.tabs { display: flex; gap: 8px; margin: 28px 0 20px; flex-wrap: wrap }
.tabs button { font: 700 .95rem var(--body); padding: 10px 18px; border-radius: 999px; border: 1.5px solid var(--line); background: #fff; cursor: pointer; color: var(--fg) }
.tabs button[aria-selected=true] { background: var(--fg); color: #fff; border-color: var(--fg) }
.tabs b { display: inline-grid; place-items: center; min-width: 24px; height: 24px; padding: 0 6px; margin-left: 6px; border-radius: 999px; background: var(--lamp); color: #1E1405; font-size: .8rem }
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 18px; padding-bottom: 60px }
.kart { background: var(--card); border-radius: 16px; overflow: hidden; box-shadow: 0 2px 10px rgba(0,0,0,.06); display: flex; flex-direction: column; transition: opacity .3s, transform .3s }
.kart.gidiyor { opacity: 0; transform: scale(.96) }
.kart .ft { aspect-ratio: 4 / 3; background: #10261A; display: grid; place-items: center; cursor: zoom-in }
.kart .ft img { width: 100%; height: 100%; object-fit: contain }
.kart .bd { padding: 14px 16px 16px; display: grid; gap: 8px; flex: 1 }
.kart .meta { font-size: .85rem; color: var(--muted) }
.kart .meta b { color: var(--fg); font-size: 1rem }
.kart input[type=text] { padding: 9px 12px; font-size: .95rem }
.kart .act { display: flex; gap: 8px; margin-top: auto; padding-top: 6px; flex-wrap: wrap } .kart .act .btn { flex: 1 }
.bos { text-align: center; color: var(--muted); padding: 60px 16px; background: #fff; border-radius: 16px }
.bos b { display: block; font-size: 2.4rem }
.ipucu { color: var(--muted); font-size: .9rem; margin: -8px 0 18px }
.buyuk { position: fixed; inset: 0; background: rgba(6,10,8,.92); display: grid; place-items: center; padding: 16px; z-index: 50; cursor: zoom-out }
.buyuk img { max-width: 100%; max-height: 100%; border-radius: 8px }
[hidden] { display: none !important }
</style>
</head>
<body>
<header><div class="wrap"><h1>📸 Ziyaretçi Kareleri</h1><a href="/admin/">← Yönetim paneli</a><a href="/#kareler" target="_blank" rel="noopener">Siteyi gör</a><button id="cikis" hidden>Çıkış</button></div></header>

<main class="wrap">
  <form class="giris" id="kurForm" hidden>
    <h2>Şifre belirleyin</h2>
    <p>Bu ekran ilk kez açılıyor. Onay ekranı için bir şifre belirleyin (en az 8 karakter). Bu şifreyi kimseyle paylaşmayın.</p>
    <label>Yeni şifre<input type="password" id="kur1" autocomplete="new-password" minlength="8" required></label>
    <label>Yeni şifre (tekrar)<input type="password" id="kur2" autocomplete="new-password" minlength="8" required></label>
    <button class="btn g">Şifreyi kaydet ve devam et</button>
    <p class="msg" id="kurMsg"></p>
  </form>

  <form class="giris" id="girisForm" hidden>
    <h2>Giriş</h2>
    <p>Ziyaretçilerden gelen fotoğrafları onaylamak için şifrenizi girin.</p>
    <label>Şifre<input type="password" id="sifre" autocomplete="current-password" required></label>
    <button class="btn g">Giriş yap</button>
    <p class="msg" id="girisMsg"></p>
  </form>

  <section id="liste" hidden>
    <div class="tabs" role="tablist">
      <button role="tab" aria-selected="true" data-t="bekliyor">Onay bekleyenler<b id="nB">0</b></button>
      <button role="tab" aria-selected="false" data-t="onay">Yayında<b id="nO" style="background:#E3EEE5">0</b></button>
      <button class="btn o" id="yenile" type="button" style="margin-left:auto">↻ Yenile</button>
    </div>
    <p class="ipucu" id="ipucu"></p>
    <div class="grid" id="grid"></div>
  </section>
</main>
<div class="buyuk" id="buyuk" hidden><img alt=""></div>

<script>
(function () {
  var jeton = null, KARELER = [], sekme = "bekliyor", fotoCache = {};
  try { jeton = sessionStorage.getItem("kp-jeton"); } catch (e) {}
  function $(id) { return document.getElementById(id); }
  function esc(s) { return String(s == null ? "" : s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/"/g, "&quot;"); }
  function api(govde) {
    return fetch("/api/yonetim", { method: "POST", headers: { "content-type": "application/json", authorization: jeton ? "Bearer " + jeton : "" }, body: JSON.stringify(govde) })
      .then(function (r) { return r.json().catch(function () { return { ok: false, hata: "Sunucu yanıt vermedi." }; }).then(function (d) { d._durum = r.status; return d; }); });
  }
  function jetonKaydet(j) { jeton = j; try { if (j) sessionStorage.setItem("kp-jeton", j); else sessionStorage.removeItem("kp-jeton"); } catch (e) {} }
  function goster(id) { ["kurForm", "girisForm", "liste"].forEach(function (x) { $(x).hidden = x !== id; }); $("cikis").hidden = id !== "liste"; }

  function basla() {
    if (jeton) return yukle();
    api({ islem: "durum" }).then(function (d) {
      if (!d.ok) { goster("girisForm"); $("girisMsg").textContent = d.hata || "Sunucuya ulaşılamadı."; return; }
      goster(d.kurulu ? "girisForm" : "kurForm");
    });
  }
  $("kurForm").onsubmit = function (e) {
    e.preventDefault();
    var a = $("kur1").value, b = $("kur2").value;
    if (a.length < 8) return ($("kurMsg").textContent = "Şifre en az 8 karakter olmalı.");
    if (a !== b) return ($("kurMsg").textContent = "İki şifre aynı değil.");
    api({ islem: "kur", sifre: a }).then(function (d) { if (d.ok) { jetonKaydet(d.jeton); yukle(); } else $("kurMsg").textContent = d.hata; });
  };
  $("girisForm").onsubmit = function (e) {
    e.preventDefault();
    var btn = this.querySelector("button"); btn.disabled = true;
    api({ islem: "giris", sifre: $("sifre").value }).then(function (d) {
      btn.disabled = false;
      if (d.ok) { jetonKaydet(d.jeton); $("sifre").value = ""; yukle(); } else $("girisMsg").textContent = d.hata;
    });
  };
  $("cikis").onclick = function () { api({ islem: "cikis" }).then(function () { jetonKaydet(null); goster("girisForm"); }); };
  $("yenile").onclick = function () { yukle(); };

  function yukle() {
    api({ islem: "liste" }).then(function (d) {
      if (d._durum === 401) { jetonKaydet(null); goster("girisForm"); $("girisMsg").textContent = d.hata || ""; return; }
      if (!d.ok) { goster("liste"); $("grid").innerHTML = '<div class="bos"><b>⚠️</b>' + esc(d.hata) + "</div>"; return; }
      KARELER = d.kareler; goster("liste"); ciz();
    });
  }
  document.querySelectorAll(".tabs [data-t]").forEach(function (b) {
    b.onclick = function () { sekme = b.dataset.t; document.querySelectorAll(".tabs [data-t]").forEach(function (x) { x.setAttribute("aria-selected", x === b); }); ciz(); };
  });

  function tarih(t) { try { return new Date(t).toLocaleString("tr-TR", { day: "numeric", month: "long", hour: "2-digit", minute: "2-digit" }); } catch (e) { return ""; } }
  function foto(id, img) {
    if (fotoCache[id]) { img.src = fotoCache[id]; return; }
    fetch("/api/foto/" + id, { headers: { authorization: "Bearer " + jeton } }).then(function (r) { return r.ok ? r.blob() : null; })
      .then(function (b) { if (b) { fotoCache[id] = URL.createObjectURL(b); img.src = fotoCache[id]; } });
  }
  function ciz() {
    var b = KARELER.filter(function (k) { return k.d === "bekliyor"; }), o = KARELER.filter(function (k) { return k.d === "onay"; });
    $("nB").textContent = b.length; $("nO").textContent = o.length;
    var list = sekme === "bekliyor" ? b : o.sort(function (x, y) { return (y.o || 0) - (x.o || 0); });
    $("ipucu").textContent = sekme === "bekliyor"
      ? "Onayla dediğiniz kare sitedeki panoya hemen eklenir (sitede görünmesi 1 dakikayı bulabilir). Reddet dediğiniz kare kalıcı olarak silinir. Onaylamadan önce kısa açıklamayı düzeltebilirsiniz."
      : "Sitede görünen ziyaretçi kareleri. ★ ile bir kareyi 'Haftanın karesi' yapabilirsiniz.";
    var grid = $("grid"); grid.innerHTML = "";
    if (!list.length) { grid.innerHTML = '<div class="bos"><b>' + (sekme === "bekliyor" ? "🎉" : "🖼️") + "</b>" + (sekme === "bekliyor" ? "Onay bekleyen fotoğraf yok." : "Henüz yayında ziyaretçi karesi yok.") + "</div>"; return; }
    list.forEach(function (k) {
      var c = document.createElement("article"); c.className = "kart";
      c.innerHTML = '<div class="ft"><img alt=""></div><div class="bd">' +
        '<div class="meta"><b>' + esc(k.a) + "</b> · " + esc(k.l) + "<br>" + tarih(k.t) + "</div>" +
        '<label style="margin:0">Kısa açıklama<input type="text" maxlength="90" value="' + esc(k.n) + '" placeholder="(boş)"></label>' +
        '<div class="act">' + (sekme === "bekliyor"
          ? '<button class="btn g" data-a="onayla">✓ Onayla</button><button class="btn r" data-a="reddet">✕ Reddet</button>'
          : '<button class="btn y' + (k.y ? " on" : "") + '" data-a="yildiz">★ ' + (k.y ? "Haftanın karesi" : "Haftanın karesi yap") + '</button><button class="btn o" data-a="onayla">Kaydet</button><button class="btn r" data-a="kaldir">Kaldır</button>') + "</div></div>";
      var img = c.querySelector("img"); foto(k.id, img);
      c.querySelector(".ft").onclick = function () { if (img.src) { $("buyuk").querySelector("img").src = img.src; $("buyuk").hidden = false; } };
      c.querySelectorAll("[data-a]").forEach(function (btn) {
        btn.onclick = function () {
          var a = btn.dataset.a;
          if (a === "reddet" && !confirm("Bu fotoğraf kalıcı olarak silinsin mi?")) return;
          if (a === "kaldir" && !confirm("Bu kare sitedeki panodan kaldırılıp silinsin mi?")) return;
          c.querySelectorAll("button").forEach(function (x) { x.disabled = true; });
          api({ islem: a, id: k.id, not: c.querySelector("input").value }).then(function (d) {
            if (d._durum === 401) { jetonKaydet(null); goster("girisForm"); return; }
            if (!d.ok) { alert(d.hata || "İşlem yapılamadı."); c.querySelectorAll("button").forEach(function (x) { x.disabled = false; }); return; }
            if (a === "yildiz") { KARELER.forEach(function (x) { x.y = x.id === k.id ? d.yildiz : false; }); ciz(); return; }
            if (a === "onayla" && sekme === "onay") { k.n = c.querySelector("input").value; c.querySelectorAll("button").forEach(function (x) { x.disabled = false; }); btn.textContent = "Kaydedildi ✓"; setTimeout(function () { btn.textContent = "Kaydet"; }, 1500); return; }
            c.classList.add("gidiyor");
            setTimeout(function () {
              if (a === "onayla") { k.d = "onay"; k.o = Date.now(); k.n = c.querySelector("input").value; }
              else KARELER = KARELER.filter(function (x) { return x.id !== k.id; });
              ciz();
            }, 280);
          });
        };
      });
      grid.appendChild(c);
    });
  }
  $("buyuk").onclick = function () { this.hidden = true; };
  basla();
})();
</script>
</body>
</html>
